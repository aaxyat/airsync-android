name: Build Android App

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build/release, e.g. 4.2.0 (empty = versionName from build.gradle.kts)"
        required: false
        type: string
      release:
        description: "Publish a GitHub release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *) VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)" ;;
            esac
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve a version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The APK must keep the same signing certificate as the build already
      # installed on the phone, otherwise Android refuses to update it in place.
      # ANDROID_KEYSTORE_B64 is the base64 of the developer's debug keystore; the
      # path is handed to Gradle explicitly via AIRSYNC_KEYSTORE (see
      # app/build.gradle.kts) instead of relying on AGP's default lookup.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            KS="$RUNNER_TEMP/airsync-debug.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            chmod 600 "$KS"
            keytool -list -keystore "$KS" -storepass android -alias androiddebugkey > /dev/null
            echo "Custom signing key restored"
            echo "AIRSYNC_KEYSTORE=$KS" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set; the APK will be signed with a throwaway CI key and will not update the installed app in place"
          fi

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Package and verify
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          APK="AirSync-${VERSION}-android.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"
          # This is the certificate of the build installed on the phone. A
          # mismatch means the APK would be rejected as an in-place update, so
          # fail instead of publishing something unusable.
          EXPECTED="bab12e50cd2d61cac87a6b77c23dcf823d0b8b057aca19f3f82d82aa3745f608"
          ACTUAL="$("$BT/apksigner" verify --print-certs "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          if [ -n "${AIRSYNC_KEYSTORE:-}" ]; then
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::APK signer $ACTUAL does not match the expected $EXPECTED"
              exit 1
            fi
            echo "Signer matches the installed build"
          fi
          "$BT/aapt2" dump badging "$APK" | head -3 || true
          sha256sum "$APK" > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Android-debug
          path: |
            AirSync-*-android.apk
            SHA256SUMS-android.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v*') || inputs.release == true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES="$RUNNER_TEMP/notes.md"
          cat > "$NOTES" <<'NOTES_EOF'
          AirSync for Android, built from this fork's main branch. Debug-signed and debuggable, the same variant that is already installed on the phone — installing over it keeps all settings and the existing pairing.

          **Install over the current app:**
          1. Download `AirSync-<version>-android.apk`.
          2. `adb install -r AirSync-<version>-android.apk` (Android refuses an in-place update if the signature differs, and this build uses the same key as the previous one).

          SHA-256 checksums are in `SHA256SUMS-android.txt`.
          NOTES_EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; updating it"
            gh release edit "$TAG" --title "AirSync ${VERSION}" --notes-file "$NOTES"
            gh release upload "$TAG" AirSync-*-android.apk SHA256SUMS-android.txt --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "AirSync ${VERSION}" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA" \
              AirSync-*-android.apk SHA256SUMS-android.txt
          fi
          gh release view "$TAG" --json tagName,name,assets \
            --jq '.tagName + " -> " + (.assets | map(.name) | join(", "))'
